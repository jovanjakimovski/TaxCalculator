name: Publish Lightsail production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: taxcalculator-lightsail-images
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        uses: docker/build-push-action@ca052bb54ab079d636c9b5f4b6d0f140a7c6b5b6 # v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/jovanjakimovski/taxcalculator-backend:${{ github.sha }}
          cache-from: type=gha,scope=lightsail-backend
          cache-to: type=gha,mode=max,scope=lightsail-backend
      - name: Build and publish licensing image
        uses: docker/build-push-action@ca052bb54ab079d636c9b5f4b6d0f140a7c6b5b6 # v6
        with:
          context: ./licensing
          push: true
          tags: ghcr.io/jovanjakimovski/taxcalculator-license-api:${{ github.sha }}
          cache-from: type=gha,scope=lightsail-license
          cache-to: type=gha,mode=max,scope=lightsail-license
      - name: Build and publish frontend image
        uses: docker/build-push-action@ca052bb54ab079d636c9b5f4b6d0f140a7c6b5b6 # v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/jovanjakimovski/taxcalculator-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_COGNITO_AUTHORITY=${{ vars.PROD_COGNITO_ISSUER_URI }}
            VITE_COGNITO_HOSTED_UI_URL=${{ vars.PROD_COGNITO_HOSTED_UI_AUTHORITY }}
            VITE_COGNITO_CLIENT_ID=${{ vars.PROD_COGNITO_APP_CLIENT_ID }}
            VITE_COGNITO_REDIRECT_URI=${{ vars.PROD_COGNITO_REDIRECT_URI }}
            VITE_COGNITO_LOGOUT_REDIRECT_URI=${{ vars.PROD_COGNITO_LOGOUT_REDIRECT_URI }}
            VITE_SUPPORT_EMAIL=${{ vars.PROD_SUPPORT_EMAIL }}
          cache-from: type=gha,scope=lightsail-frontend
          cache-to: type=gha,mode=max,scope=lightsail-frontend

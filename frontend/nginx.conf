limit_req_zone $binary_remote_addr zone=license_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=2r/s;
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    client_body_timeout 15s;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.amazoncognito.com ${COGNITO_IDP_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/license/lemonsqueezy/webhook {
        proxy_pass http://license-api:8081;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }

    location /api/license/ {
        limit_req zone=license_limit burst=20 nodelay;
        proxy_pass http://license-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location /api/ {
        limit_req zone=rate_limit burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

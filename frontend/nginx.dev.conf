limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=2r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Empty for localhost; CloudFormation supplies a routing guard for its origin.
    if ($http_x_taxcalculator_origin != "${DEV_ORIGIN_TOKEN}") { return 403; }
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/tax/ {
        limit_req zone=rate_limit burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /api/ { return 404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}

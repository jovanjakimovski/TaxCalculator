name: Deploy development app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taxcalculator-dev
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.AWS_DEV_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEV_REGION || 'eu-central-1' }}
      - name: Publish and activate immutable dev images
        env:
          AWS_DEV_STACK_NAME: ${{ vars.AWS_DEV_STACK_NAME || 'taxcalculator-dev' }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/aws-dev.sh release --release "$RELEASE_ID"
